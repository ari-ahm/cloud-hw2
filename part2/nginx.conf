log_format upstreams '$remote_addr "$request" $status upstream=$upstream_addr';
upstream queue_backend {
    server app:8000;
}
server {
    listen 80;
    access_log /dev/stdout upstreams;
    location / {
        proxy_pass http://queue_backend;
        proxy_next_upstream off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
