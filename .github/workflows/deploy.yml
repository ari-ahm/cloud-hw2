name: Deploy existing tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to deploy
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  pages:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify exact tag and render its page
        run: |
          git check-ref-format "refs/tags/$VERSION"
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import html
          import os
          from pathlib import Path
          path = Path('part2/site/index.html')
          text = path.read_text()
          assert text.count('__VERSION__') == 1
          path.write_text(text.replace('__VERSION__', html.escape(os.environ['VERSION'])))
          PY
        env:
          VERSION: ${{ inputs.tag }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site/
      - id: deploy
        uses: actions/deploy-pages@v4
